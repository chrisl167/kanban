<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>服药与工作看板</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="container header">
        <div class="header-title">
          <div class="brand-mark" aria-hidden="true">板</div>
          <div>
            <h1 id="boardTitle">服药与工作看板</h1>
            <p class="subtitle" id="boardSubtitle">待办、进行中、已完成；可保留服药任务，也可新增工作事项。</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="secondary" id="profileButton" hidden>个人中心</button>
          <button class="secondary" id="multiSelectButton">多选</button>
          <button class="secondary" id="authButton">登录</button>
          <button class="primary" id="addTask">新增事项</button>
        </div>
      </header>

      <main class="container">
        <section class="summary">
          <div class="panel today-panel">
            <div class="panel-head">
              <h3>今日待处理</h3>
              <span class="status-pill local" id="todayPill">本地缓存</span>
            </div>
            <ul id="todayList"></ul>
          </div>
          <div class="panel stats-panel">
            <div class="panel-head">
              <h3>进度统计</h3>
              <span class="status-pill" id="cloudStatus">本地模式</span>
            </div>
            <div class="stats" id="stats"></div>
            <div class="progress-track" aria-label="完成进度">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="cloud-status" id="cloudStatusText">记录保存在当前浏览器。</p>
          </div>
        </section>

        <section class="batch-bar" id="batchBar" hidden>
          <div class="batch-info">
            <span id="batchCount">已选 0 项</span>
            <button type="button" class="secondary" id="selectAllButton">全选</button>
          </div>
          <div class="batch-actions">
            <button type="button" data-batch-move="todo">移到待办</button>
            <button type="button" data-batch-move="doing">移到进行中</button>
            <button type="button" data-batch-move="done">标记完成</button>
            <button type="button" class="danger" id="batchDeleteButton">批量删除</button>
            <button type="button" class="secondary" id="exitBatchButton">退出多选</button>
          </div>
          <div class="batch-trash" id="batchTrash" aria-label="拖到此处删除所选事项">
            <span class="trash-icon">🗑</span>
            <span>拖到此处删除</span>
          </div>
        </section>

        <section class="board" id="board"></section>
      </main>
    </div>

    <dialog id="authDialog">
      <form id="authForm">
        <h3 id="authMode">账号登录</h3>
        <p class="auth-hint">使用账号密码登录；任务数据将同步到 242 服务器上的 SQLite 数据库。</p>
        <label>邮箱<input name="email" type="email" autocomplete="email" required maxlength="120" /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="120" /></label>
        <p class="auth-message" id="authMessage"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelAuth">取消</button>
          <button type="button" class="secondary" id="authRegister">注册账号</button>
          <button type="submit" class="primary" id="authSubmit">登录</button>
        </div>
      </form>
    </dialog>

    <dialog id="passwordDialog">
      <form id="passwordForm">
        <h3 id="passwordDialogTitle">修改密码</h3>
        <p class="auth-hint" id="passwordHint">为保障账号安全，请先设置一个新的登录密码。</p>
        <label>当前密码<input name="old_password" type="password" autocomplete="current-password" required minlength="6" maxlength="120" /></label>
        <div class="form-grid">
          <label>新密码<input name="new_password" type="password" autocomplete="new-password" required minlength="6" maxlength="120" /></label>
          <label>确认新密码<input name="confirm_password" type="password" autocomplete="new-password" required minlength="6" maxlength="120" /></label>
        </div>
        <p class="auth-message" id="passwordMessage"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelPassword">取消</button>
          <button type="submit" class="primary" id="passwordSubmit">保存新密码</button>
        </div>
      </form>
    </dialog>

    <dialog id="profileDialog">
      <form id="profileForm">
        <h3>个人中心与设置</h3>
        <p class="auth-hint">账号资料、看板标题和主题偏好会随当前账号保存，换设备登录后自动同步。</p>
        <div class="profile-meta" id="profileMeta"></div>
        <div class="form-grid">
          <label>显示昵称<input name="display_name" type="text" maxlength="60" placeholder="可留空，默认显示邮箱" /></label>
          <label>看板标题<input name="board_title" type="text" maxlength="80" /></label>
          <label>暗色模式
            <select name="theme">
              <option value="light">浅色</option>
              <option value="dark">暗色</option>
              <option value="system">跟随系统</option>
            </select>
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelProfile">关闭</button>
          <button type="button" class="secondary" id="openPasswordFromProfile">修改密码</button>
          <button type="submit" class="primary">保存设置</button>
        </div>
      </form>
    </dialog>

    <dialog id="taskDialog">
      <form id="taskForm" method="dialog">
        <h3 id="dialogTitle">新增事项</h3>
        <label>事项名称<input name="title" required maxlength="80" /></label>
        <label>备注说明<textarea name="description" maxlength="300"></textarea></label>
        <div class="form-grid">
          <label>状态
            <select name="status">
              <option value="todo">待办</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </label>
          <label>优先级
            <select name="priority">
              <option value="low">低</option>
              <option value="normal" selected>普通</option>
              <option value="high">高</option>
              <option value="urgent">紧急</option>
            </select>
          </label>
          <label>分类
            <select name="category">
              <option value="work">工作</option>
              <option value="medication">服药</option>
              <option value="personal">个人</option>
              <option value="other">其他</option>
            </select>
          </label>
          <label>截止日期<input type="date" name="due_date" /></label>
          <label>时间<input type="time" name="due_time" /></label>
          <label>标签（逗号分隔）<input name="tags" maxlength="120" /></label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelDialog">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
